services:
  cadrixai:
    image: ${CADRIX_IMAGE:-cadrixai:local}
    build: .
    init: true
    ports:
      - "127.0.0.1:${CADRIX_PORT:-8000}:8000"
    volumes:
      - models:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  models:
